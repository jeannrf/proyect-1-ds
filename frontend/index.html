<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoML Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>AutoML Advisor</h1>
      <p>Bienvenido a tu analista de datos inteligente. Estamos listos para comenzar a procesar tus datasets.</p>

      <div id="status-indicator" class="status-box">
        <span class="status-dot"></span>
        <span id="status-text">Conectando con el servidor...</span>
      </div>

      <!-- Futura área de carga de archivos -->
      <div id="upload-area" style="margin-top: 2rem; display: none;">
        <p>El sistema está listo.</p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
